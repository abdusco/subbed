<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Admin – subbed</title>
        <meta name="description" content="Manage videos and subtitles for subbed." />
        <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0e0d14" media="(prefers-color-scheme: dark)" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="subbed" />
        <link rel="manifest" href="/static/admin.manifest.json" />
        <link rel="icon" type="image/svg+xml" href="/static/admin/icon.svg" />
        <link rel="icon" type="image/png" sizes="192x192" href="/static/admin/icon-192.png" />
        <link rel="apple-touch-icon" href="/static/admin/apple-touch-icon.png" />
        <link rel="stylesheet" href="/static/admin/admin.css" />
        <script>
            // apply the saved appearance before first paint
            try {
                const theme = localStorage.getItem("subbed-admin-theme");
                if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <!-- the component module must come before Alpine so its alpine:init listener is registered in time -->
        <script type="module" src="/static/admin/app.js"></script>
        <script defer src="/static/alpinejs@3.x.x.min.js"></script>
    </head>
    <body x-data="admin" x-cloak>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
                <symbol id="i-upload" viewBox="0 0 24 24">
                    <path d="M12 15V4M7 9l5-5 5 5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
                </symbol>
                <symbol id="i-trash" viewBox="0 0 24 24">
                    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" />
                </symbol>
                <symbol id="i-search" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </symbol>
                <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
                <symbol id="i-sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </symbol>
                <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></symbol>
                <symbol id="i-monitor" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="12" rx="2" />
                    <path d="M8 20h8M12 16v4" />
                </symbol>
                <symbol id="i-logout" viewBox="0 0 24 24">
                    <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9" />
                </symbol>
                <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
                <symbol id="i-check" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="m8 12 3 3 5-6" />
                </symbol>
                <symbol id="i-alert" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v6M12 16.5v.5" />
                </symbol>
                <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></symbol>
                <symbol id="i-file" viewBox="0 0 24 24">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6" />
                </symbol>
                <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></symbol>
                <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></symbol>
                <symbol id="i-captions" viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="3" />
                    <path d="M7 11h3M7 15h6M14 11h3" />
                </symbol>
                <symbol id="i-stop" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <rect x="9" y="9" width="6" height="6" rx="1" />
                </symbol>
                <symbol id="i-translate" viewBox="0 0 24 24">
                    <path d="M4 5h9M8.5 3v2M6 5c.5 3.5 3 6.5 6.5 8M11 5c-.5 3.5-3 6.5-6.5 8M13 20l4-9 4 9M14.5 17h5" />
                </symbol>
                <symbol id="i-sparkles" viewBox="0 0 24 24">
                    <path d="M10 4l1.8 4.7L16.5 10.5l-4.7 1.8L10 17l-1.8-4.7L3.5 10.5l4.7-1.8zM18 3v4M16 5h4M18 15v4M16 17h4" />
                </symbol>
                <symbol id="i-refresh" viewBox="0 0 24 24">
                    <path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5" />
                </symbol>
            </defs>
        </svg>

        <noscript><p style="padding: 24px">subbed admin needs JavaScript.</p></noscript>

        <header class="topbar">
            <a class="brand" href="/admin" :aria-label="t('nav.logo')">
                <img src="/static/admin/icon.svg" alt="" width="32" height="32" />
                <span>subbed</span>
                <span class="badge" x-text="t('app.admin')"></span>
            </a>
            <button
                class="btn btn-ghost btn-icon"
                type="button"
                popovertarget="settings"
                :aria-label="t('settings.title')"
                :title="t('settings.title')"
            >
                <svg class="icon"><use href="#i-menu" /></svg>
            </button>
        </header>

        <div id="settings" class="settings" x-ref="settings" popover>
            <h2 x-text="t('settings.title')"></h2>

            <label class="field">
                <span x-text="t('settings.language')"></span>
                <select :value="languagePreference" @change="setLanguage($event.target.value)">
                    <option value="auto" x-text="t('settings.languageAuto')"></option>
                    <option value="en">English</option>
                    <option value="tr">Türkçe</option>
                </select>
            </label>

            <div class="field" role="group" aria-labelledby="theme-label">
                <span id="theme-label" x-text="t('settings.theme')"></span>
                <div class="segmented">
                    <button type="button" :aria-pressed="themePreference === 'system'" @click="setTheme('system')">
                        <svg class="icon"><use href="#i-monitor" /></svg>
                        <span x-text="t('theme.system')"></span>
                    </button>
                    <button type="button" :aria-pressed="themePreference === 'light'" @click="setTheme('light')">
                        <svg class="icon"><use href="#i-sun" /></svg>
                        <span x-text="t('theme.light')"></span>
                    </button>
                    <button type="button" :aria-pressed="themePreference === 'dark'" @click="setTheme('dark')">
                        <svg class="icon"><use href="#i-moon" /></svg>
                        <span x-text="t('theme.dark')"></span>
                    </button>
                </div>
            </div>

            <div class="field">
                <span x-text="t('settings.install')"></span>
                <template x-if="installed">
                    <p class="hint" x-text="t('settings.installed')"></p>
                </template>
                <template x-if="!installed && installPrompt">
                    <div class="field">
                        <p class="hint" x-text="t('settings.installHint')"></p>
                        <button class="btn btn-primary" type="button" @click="install()">
                            <svg class="icon"><use href="#i-download" /></svg>
                            <span x-text="t('settings.install')"></span>
                        </button>
                    </div>
                </template>
                <template x-if="!installed && !installPrompt">
                    <p class="hint" x-text="t('settings.installManual')"></p>
                </template>
            </div>

            <button class="btn btn-ghost" type="button" @click="openGeneration()">
                <svg class="icon"><use href="#i-captions" /></svg>
                <span x-text="t('generation.open')"></span>
            </button>

            <button class="btn btn-ghost" type="button" @click="signOut()">
                <svg class="icon"><use href="#i-logout" /></svg>
                <span x-text="t('nav.signOut')"></span>
            </button>
        </div>

        <main>
            <div class="banner banner-offline" x-show="!online" role="status">
                <svg class="icon"><use href="#i-alert" /></svg>
                <span x-text="t('status.offline')"></span>
            </div>
            <div class="banner banner-update" x-show="updateReady" role="status">
                <svg class="icon"><use href="#i-refresh" /></svg>
                <span x-text="t('status.update')"></span>
                <button class="btn btn-primary btn-small" type="button" @click="applyUpdate()" x-text="t('status.reload')"></button>
            </div>

            <div class="page-head">
                <div>
                    <h1 x-text="t('library.title')"></h1>
                    <p class="summary" x-show="!loading && !loadFailed">
                        <span x-text="t('videos', { n: videos.length })"></span> ·
                        <span x-text="t('subtitles', { n: subtitleCount })"></span>
                    </p>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="button" @click="openAddVideo()">
                        <svg class="icon"><use href="#i-plus" /></svg>
                        <span x-text="t('video.add')"></span>
                    </button>
                </div>
            </div>

            <section class="jobs" x-show="jobs.length > 0" aria-labelledby="jobs-title">
                <h2 id="jobs-title" x-text="t('jobs.title')"></h2>
                <template x-for="job in visibleJobs" :key="job.id">
                    <div class="job">
                        <details class="job-details" @toggle="onJobToggle(job, $event)">
                            <summary>
                                <span class="job-status" :class="`is-${job.status}`" x-text="t(`jobs.status.${job.status}`)"></span>
                                <span class="job-title" x-text="job.video_title"></span>
                                <time class="job-time" :datetime="jobDate(job).toISOString()" x-text="formatJobTime(job)"></time>
                                <div class="job-progress" x-show="job.status === 'running'">
                                    <progress max="100" :value="job.progress" :aria-label="jobProgressText(job)"></progress>
                                    <span class="hint" x-text="jobProgressText(job)"></span>
                                </div>
                            </summary>
                            <p class="hint job-detail" x-text="jobSummary(job)"></p>
                            <p class="error-text job-detail" x-show="job.error" x-text="job.error"></p>
                            <div
                                class="job-log"
                                :id="`job-log-${job.id}`"
                                role="log"
                                tabindex="0"
                                :aria-label="t('jobs.log', { title: job.video_title })"
                            >
                                <p class="hint" x-show="!(jobLogs[job.id]?.lines.length)" x-text="t('jobs.noLogs')"></p>
                                <template x-for="line in jobLogs[job.id]?.lines ?? []" :key="line.id">
                                    <div class="log-line" :class="{ 'is-error': line.level === 'error' }">
                                        <time x-text="formatLogTime(line)"></time>
                                        <span x-text="line.message"></span>
                                    </div>
                                </template>
                            </div>
                        </details>
                        <!-- beside the summary, not in it: a summary can't hold buttons -->
                        <span class="job-actions">
                            <button
                                class="btn btn-ghost btn-icon btn-small"
                                type="button"
                                x-show="isJobActive(job)"
                                :disabled="Boolean(jobBusy[job.id])"
                                :aria-label="t('jobs.cancel')"
                                :title="t('jobs.cancel')"
                                @click="cancelJob(job)"
                            >
                                <svg class="icon"><use href="#i-stop" /></svg>
                            </button>
                            <button
                                class="btn btn-ghost btn-icon btn-small btn-danger-text"
                                type="button"
                                :aria-label="t('jobs.delete')"
                                :title="t('jobs.delete')"
                                @click="askDelete('job', job, `${job.video_title} · ${formatJobTime(job)}`)"
                            >
                                <svg class="icon"><use href="#i-trash" /></svg>
                            </button>
                        </span>
                    </div>
                </template>
                <button
                    class="btn btn-ghost btn-small"
                    type="button"
                    x-show="jobs.length > JOBS_SHOWN"
                    @click="jobsExpanded = !jobsExpanded"
                >
                    <span x-text="jobsExpanded ? t('jobs.showFewer') : t('jobs.showOlder')"></span>
                </button>
            </section>

            <label class="search" x-show="videos.length > 0">
                <svg class="icon"><use href="#i-search" /></svg>
                <span class="sr-only" x-text="t('library.search')"></span>
                <input type="search" x-model="query" :placeholder="t('library.search')" autocomplete="off" />
            </label>

            <div class="video-list" x-show="loading" aria-hidden="true">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>

            <div class="empty" x-show="!loading && loadFailed && !videos.length">
                <svg class="icon"><use href="#i-alert" /></svg>
                <strong x-text="t('library.loadFailed')"></strong>
                <p x-text="loadError"></p>
                <button class="btn btn-ghost" type="button" @click="loadVideos()">
                    <svg class="icon"><use href="#i-refresh" /></svg>
                    <span x-text="t('library.retry')"></span>
                </button>
            </div>

            <div class="empty" x-show="!loading && !loadFailed && !videos.length">
                <svg class="icon"><use href="#i-captions" /></svg>
                <strong x-text="t('library.empty')"></strong>
                <p x-text="t('library.emptyHint')"></p>
                <button class="btn btn-primary" type="button" @click="openAddVideo()">
                    <svg class="icon"><use href="#i-plus" /></svg>
                    <span x-text="t('video.add')"></span>
                </button>
            </div>

            <div class="empty" x-show="videos.length > 0 && filteredVideos.length === 0">
                <svg class="icon"><use href="#i-search" /></svg>
                <strong x-text="t('library.noMatch', { query })"></strong>
            </div>

            <div class="video-list">
                <template x-for="video in filteredVideos" :key="video.id">
                    <article class="video-card">
                        <a class="thumb" :href="playerLink(video)" :title="t('video.watch')" :aria-label="t('video.watch')">
                            <svg class="icon"><use href="#i-play" /></svg>
                            <template x-if="thumbnail(video)">
                                <img :src="thumbnail(video)" alt="" loading="lazy" @error="$el.remove()" />
                            </template>
                        </a>
                        <div class="video-body">
                            <div>
                                <h3 class="video-title" x-text="video.title"></h3>
                                <p class="video-url" x-text="video.original_url"></p>
                            </div>
                            <div class="chips">
                                <template x-for="subtitle in video.subtitles" :key="subtitle.id">
                                    <span class="chip">
                                        <span x-text="subtitle.language.toUpperCase()"></span>
                                        <small x-text="subtitle.type.toUpperCase()"></small>
                                        <button
                                            type="button"
                                            :aria-label="t('subtitle.delete', { language: subtitle.language.toUpperCase() })"
                                            :title="t('subtitle.delete', { language: subtitle.language.toUpperCase() })"
                                            @click="askDelete('subtitle', subtitle, `${video.title} · ${subtitle.language.toUpperCase()}`)"
                                        >
                                            <svg class="icon"><use href="#i-x" /></svg>
                                        </button>
                                    </span>
                                </template>
                                <span class="hint" x-show="video.subtitles.length === 0" x-text="t('video.noSubtitles')"></span>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-small" type="button" @click="openUpload({ videoId: video.id })">
                                    <svg class="icon"><use href="#i-upload" /></svg>
                                    <span x-text="t('subtitle.add')"></span>
                                </button>
                                <button
                                    class="btn btn-small"
                                    type="button"
                                    :aria-label="t('generation.transcribeLabel')"
                                    :title="t('generation.transcribeLabel')"
                                    @click="openTranscribe(video)"
                                >
                                    <svg class="icon"><use href="#i-sparkles" /></svg>
                                    <span x-text="t('generation.transcribe')"></span>
                                </button>
                                <button
                                    class="btn btn-small"
                                    type="button"
                                    :aria-label="t('generation.translateLabel')"
                                    :title="video.subtitles.length ? t('generation.translateLabel') : t('generation.translateNeedsSubtitle')"
                                    :disabled="video.subtitles.length === 0"
                                    @click="openTranslate(video)"
                                >
                                    <svg class="icon"><use href="#i-translate" /></svg>
                                    <span x-text="t('generation.translate')"></span>
                                </button>
                                <button
                                    class="btn btn-small"
                                    type="button"
                                    :aria-label="t('video.editLabel')"
                                    :title="t('video.editLabel')"
                                    @click="openEdit(video)"
                                >
                                    <svg class="icon"><use href="#i-edit" /></svg>
                                    <span x-text="t('video.edit')"></span>
                                </button>
                                <button
                                    class="btn btn-small btn-danger-text"
                                    type="button"
                                    :aria-label="t('video.deleteLabel')"
                                    :title="t('video.deleteLabel')"
                                    @click="askDelete('video', video, video.title)"
                                >
                                    <svg class="icon"><use href="#i-trash" /></svg>
                                    <span x-text="t('video.delete')"></span>
                                </button>
                            </div>
                        </div>
                    </article>
                </template>
            </div>
        </main>

        <!-- add video -->
        <dialog x-ref="addDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="submitVideo()">
                <div class="dialog-head">
                    <h2 x-text="t('video.addTitle')"></h2>
                    <button class="btn btn-ghost btn-icon" type="button" :aria-label="t('common.close')" @click="$refs.addDialog.close()">
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>
                <label class="field">
                    <span x-text="t('video.url')"></span>
                    <input
                        type="text"
                        inputmode="url"
                        x-model="videoForm.url"
                        :placeholder="t('video.urlPlaceholder')"
                        :aria-invalid="videoUrlInvalid"
                        required
                        autocomplete="off"
                        autofocus
                    />
                    <span class="error-text" x-show="videoUrlInvalid" x-text="t('video.urlInvalid')"></span>
                </label>
                <img class="preview" x-show="videoPreview" :src="videoPreview" alt="" @error="$el.removeAttribute('src')" />
                <label class="field">
                    <span x-text="t('video.name')"></span>
                    <input
                        type="text"
                        x-model="videoForm.title"
                        :placeholder="videoForm.titleLoading ? t('video.titleFetching') : t('video.namePlaceholder')"
                        @input="onTitleInput($event)"
                        required
                        autocomplete="off"
                    />
                </label>
                <div class="dialog-foot">
                    <button class="btn btn-ghost" type="button" @click="$refs.addDialog.close()" x-text="t('common.cancel')"></button>
                    <button class="btn btn-primary" type="submit" :disabled="videoForm.busy || !videoUrlId || !videoForm.title.trim()">
                        <span x-text="videoForm.busy ? t('common.working') : t('video.add')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <!-- upload subtitle -->
        <dialog x-ref="uploadDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="submitSubtitle()">
                <div class="dialog-head">
                    <h2 x-text="t('subtitle.upload')"></h2>
                    <button
                        class="btn btn-ghost btn-icon"
                        type="button"
                        :aria-label="t('common.close')"
                        @click="$refs.uploadDialog.close()"
                    >
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>

                <template x-if="videoLocked">
                    <div class="video-context">
                        <img x-show="thumbnail(selectedVideo)" :src="thumbnail(selectedVideo)" alt="" @error="$el.remove()" />
                        <div>
                            <span class="hint" x-text="t('subtitle.forVideo')"></span>
                            <p class="name" x-text="selectedVideo.title"></p>
                        </div>
                    </div>
                </template>

                <template x-if="!subtitleForm.file">
                    <label
                        class="dropzone"
                        :class="{ 'is-dragging': subtitleForm.dragging }"
                        @dragover.prevent="subtitleForm.dragging = true"
                        @dragleave="subtitleForm.dragging = false"
                        @drop.prevent.stop="onZoneDrop($event)"
                    >
                        <svg class="icon"><use href="#i-upload" /></svg>
                        <strong x-text="t('subtitle.dropTitle')"></strong>
                        <span class="hint" x-text="t('subtitle.dropHint')"></span>
                        <input class="sr-only" type="file" accept=".srt,.vtt" @change="onFilePicked($event)" />
                    </label>
                </template>
                <template x-if="subtitleForm.file">
                    <div class="file-row">
                        <svg class="icon"><use href="#i-file" /></svg>
                        <span class="name" x-text="subtitleForm.pasted ? t('subtitle.pasted') : subtitleForm.file.name"></span>
                        <span class="meta" x-text="subtitleForm.type.toUpperCase()"></span>
                        <button
                            class="btn btn-ghost btn-icon btn-small"
                            type="button"
                            :aria-label="t('subtitle.remove')"
                            :title="t('subtitle.remove')"
                            @click="clearSubtitleFile()"
                        >
                            <svg class="icon"><use href="#i-x" /></svg>
                        </button>
                    </div>
                </template>

                <template x-if="!videoLocked">
                    <label class="field">
                        <span x-text="t('subtitle.video')"></span>
                        <select x-model="subtitleForm.videoId" required>
                            <option value="" x-text="t('subtitle.pickVideo')"></option>
                            <template x-for="video in videos" :key="video.id">
                                <option :value="String(video.id)" x-text="video.title"></option>
                            </template>
                        </select>
                    </label>
                </template>

                <label class="field">
                    <span x-text="t('subtitle.language')"></span>
                    <input
                        type="text"
                        list="language-suggestions"
                        x-model="subtitleForm.language"
                        placeholder="en"
                        :aria-invalid="languageInvalid"
                        required
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                    />
                    <datalist id="language-suggestions">
                        <option value="en"></option>
                        <option value="tr"></option>
                        <option value="de"></option>
                        <option value="fr"></option>
                        <option value="es"></option>
                        <option value="it"></option>
                        <option value="pt-br"></option>
                        <option value="ru"></option>
                        <option value="ar"></option>
                        <option value="ja"></option>
                    </datalist>
                    <span class="hint" x-show="!languageInvalid" x-text="t('subtitle.languageHint')"></span>
                    <span class="error-text" x-show="languageInvalid" x-text="t('subtitle.languageInvalid')"></span>
                </label>

                <div class="dialog-foot">
                    <button class="btn btn-ghost" type="button" @click="$refs.uploadDialog.close()" x-text="t('common.cancel')"></button>
                    <button class="btn btn-primary" type="submit" :disabled="!canUpload">
                        <span x-text="subtitleForm.busy ? t('common.working') : t('subtitle.upload')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <!-- edit video -->
        <dialog x-ref="editDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="submitEdit()">
                <div class="dialog-head">
                    <h2 x-text="t('video.editTitle')"></h2>
                    <button class="btn btn-ghost btn-icon" type="button" :aria-label="t('common.close')" @click="$refs.editDialog.close()">
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>
                <label class="field">
                    <span x-text="t('video.name')"></span>
                    <input type="text" x-model="editForm.title" maxlength="300" required autocomplete="off" />
                    <span class="hint" x-text="editForm.url"></span>
                </label>
                <div class="dialog-foot">
                    <button class="btn btn-ghost" type="button" @click="$refs.editDialog.close()" x-text="t('common.cancel')"></button>
                    <button class="btn btn-primary" type="submit" :disabled="!canSaveEdit">
                        <span x-text="editForm.busy ? t('common.working') : t('common.save')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <!-- transcribe a video's audio -->
        <dialog x-ref="transcribeDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="submitTranscribe()">
                <div class="dialog-head">
                    <h2 x-text="t('generation.transcribeTitle')"></h2>
                    <button
                        class="btn btn-ghost btn-icon"
                        type="button"
                        :aria-label="t('common.close')"
                        @click="$refs.transcribeDialog.close()"
                    >
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>

                <div class="video-context">
                    <img x-show="transcribeForm.thumbnail" :src="transcribeForm.thumbnail" alt="" @error="$el.remove()" />
                    <div>
                        <span class="hint" x-text="t('generation.forVideo')"></span>
                        <p class="name" x-text="transcribeForm.title"></p>
                    </div>
                </div>

                <label class="field">
                    <span x-text="t('generation.source')"></span>
                    <select x-model="transcribeForm.source">
                        <option value="" x-text="t('generation.sourceAuto')"></option>
                        <template x-for="language in generationLanguages" :key="language.code">
                            <option :value="language.code" x-text="`${language.name} (${language.code})`"></option>
                        </template>
                    </select>
                    <span class="hint" x-text="t('generation.sourceHint')"></span>
                </label>

                <div class="dialog-foot">
                    <button
                        class="btn btn-ghost"
                        type="button"
                        @click="$refs.transcribeDialog.close()"
                        x-text="t('common.cancel')"
                    ></button>
                    <button class="btn btn-primary" type="submit" :disabled="transcribeForm.busy">
                        <span x-text="transcribeForm.busy ? t('common.working') : t('generation.start')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <!-- translate one of a video's subtitles -->
        <dialog x-ref="translateDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="submitTranslate()">
                <div class="dialog-head">
                    <h2 x-text="t('generation.translateTitle')"></h2>
                    <button
                        class="btn btn-ghost btn-icon"
                        type="button"
                        :aria-label="t('common.close')"
                        @click="$refs.translateDialog.close()"
                    >
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>

                <div class="video-context">
                    <img x-show="translateForm.thumbnail" :src="translateForm.thumbnail" alt="" @error="$el.remove()" />
                    <div>
                        <span class="hint" x-text="t('generation.forVideo')"></span>
                        <p class="name" x-text="translateForm.title"></p>
                    </div>
                </div>

                <label class="field">
                    <span x-text="t('generation.translateFrom')"></span>
                    <select x-model="translateForm.source">
                        <template x-for="code in translateForm.available" :key="code">
                            <option :value="code" x-text="languageLabel(code)"></option>
                        </template>
                    </select>
                    <span class="hint" x-text="t('generation.translateFromHint')"></span>
                </label>

                <fieldset class="field">
                    <legend x-text="t('generation.targets')"></legend>
                    <div class="check-grid">
                        <template x-for="language in generationLanguages" :key="language.code">
                            <label class="check" :class="{ 'is-disabled': language.code === translateForm.source }">
                                <input
                                    type="checkbox"
                                    :value="language.code"
                                    x-model="translateForm.targets"
                                    :disabled="language.code === translateForm.source"
                                />
                                <span x-text="language.name"></span>
                            </label>
                        </template>
                    </div>
                    <span class="hint" x-text="t('generation.targetsHint')"></span>
                </fieldset>

                <div class="dialog-foot">
                    <button class="btn btn-ghost" type="button" @click="$refs.translateDialog.close()" x-text="t('common.cancel')"></button>
                    <button class="btn btn-primary" type="submit" :disabled="!canTranslate">
                        <span x-text="translateForm.busy ? t('common.working') : t('generation.start')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <!-- subtitle generation settings -->
        <dialog x-ref="generationDialog" @click="closeOnBackdrop($event)">
            <div class="dialog-form">
                <div class="dialog-head">
                    <h2 x-text="t('generation.title')"></h2>
                    <button
                        class="btn btn-ghost btn-icon"
                        type="button"
                        :aria-label="t('common.close')"
                        @click="$refs.generationDialog.close()"
                    >
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>

                <p class="error-text" x-show="generation.failed" x-text="t('generation.loadFailed')"></p>

                <form class="form-section" @submit.prevent="saveModel()">
                    <label class="field">
                        <span x-text="t('generation.model')"></span>
                        <input
                            type="text"
                            x-model="generation.model"
                            :placeholder="t('generation.modelPlaceholder', { model: generation.modelDefault })"
                            maxlength="200"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                        />
                        <span class="hint" x-text="t('generation.modelHint', { model: generation.modelDefault })"></span>
                    </label>
                    <div class="section-actions">
                        <button class="btn btn-primary btn-small" type="submit" :disabled="!canSaveModel">
                            <span x-text="generation.busy === 'model' ? t('common.working') : t('common.save')"></span>
                        </button>
                    </div>
                </form>

                <form class="form-section" @submit.prevent="saveCookies()">
                    <label class="field">
                        <span x-text="t('generation.cookies')"></span>
                        <textarea
                            x-model="generation.cookiesText"
                            rows="5"
                            placeholder="# Netscape HTTP Cookie File"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                        ></textarea>
                        <span class="hint" x-text="cookieSummary"></span>
                        <span class="hint" x-text="t('generation.cookiesHint')"></span>
                    </label>
                    <div class="section-actions">
                        <button
                            class="btn btn-small btn-danger-text"
                            type="button"
                            :disabled="!generation.cookieCount || generation.busy !== ''"
                            @click="clearCookies()"
                            x-text="t('generation.cookiesClear')"
                        ></button>
                        <button
                            class="btn btn-primary btn-small"
                            type="submit"
                            :disabled="!generation.cookiesText.trim() || generation.busy !== ''"
                        >
                            <span x-text="generation.busy === 'cookies' ? t('common.working') : t('generation.cookiesSave')"></span>
                        </button>
                    </div>
                </form>

                <div class="form-section">
                    <div class="field">
                        <span x-text="t('generation.ytdlp')"></span>
                        <span
                            class="hint"
                            x-text="generation.ytdlpInstalled ? t('generation.ytdlpVersion', { version: generation.ytdlpVersion }) : t('generation.ytdlpMissing')"
                        ></span>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-small" type="button" :disabled="generation.busy !== ''" @click="updateYtDlp()">
                            <svg class="icon"><use href="#i-refresh" /></svg>
                            <span x-text="generation.busy === 'ytdlp' ? t('common.working') : t('generation.ytdlpUpdate')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </dialog>

        <!-- confirm delete -->
        <dialog x-ref="confirmDialog" @click="closeOnBackdrop($event)">
            <form class="dialog-form" method="dialog" @submit.prevent="confirmDelete()">
                <div class="dialog-head">
                    <h2 x-text="t('confirm.title')"></h2>
                </div>
                <div class="field">
                    <p x-text="t(`confirm.${confirmation.kind}`, { label: confirmation.label })"></p>
                    <p class="hint" x-text="t('confirm.undo')"></p>
                </div>
                <div class="dialog-foot">
                    <button class="btn btn-ghost" type="button" @click="$refs.confirmDialog.close()" x-text="t('common.cancel')"></button>
                    <button class="btn btn-danger" type="submit" :disabled="confirmation.busy">
                        <span x-text="confirmation.busy ? t('common.working') : t('common.delete')"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <div class="drop-overlay" x-show="pageDragging" aria-hidden="true">
            <svg class="icon"><use href="#i-upload" /></svg>
            <span x-text="t('subtitle.dropNow')"></span>
        </div>

        <div class="toasts" x-ref="toasts" popover="manual" role="status" aria-live="polite">
            <template x-for="toast in toasts" :key="toast.id">
                <div class="toast" :class="`toast-${toast.kind}`">
                    <svg class="icon"><use :href="toast.kind === 'error' ? '#i-alert' : '#i-check'" /></svg>
                    <span x-text="toast.text"></span>
                    <button type="button" :aria-label="t('common.close')" @click="dismissToast(toast.id)">
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>
            </template>
        </div>
    </body>
</html>
