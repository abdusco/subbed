<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>subbed</title>
        <meta name="description" content="Watch YouTube videos with your own subtitles." />
        <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0e0d14" media="(prefers-color-scheme: dark)" />
        <link rel="icon" type="image/svg+xml" href="/static/player/icon.svg" />
        <link rel="stylesheet" href="/static/player/player.css" />
        <script>
            // apply the saved appearance before first paint
            try {
                const theme = localStorage.getItem("subbed-player-theme");
                if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <!-- the component module must come before Alpine so its alpine:init listener is registered in time -->
        <script type="module" src="/static/player/app.js"></script>
        <script defer src="/static/alpinejs@3.x.x.min.js"></script>
    </head>
    <body x-data="player" x-cloak>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
                <symbol id="i-user" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" />
                </symbol>
                <symbol id="i-sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </symbol>
                <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></symbol>
                <symbol id="i-monitor" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="12" rx="2" />
                    <path d="M8 20h8M12 16v4" />
                </symbol>
                <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
                <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
                <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
                <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" /></symbol>
                <symbol id="i-alert" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v6M12 16.5v.5" />
                </symbol>
                <symbol id="i-info" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 11v6M12 7.5v.5" />
                </symbol>
                <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></symbol>
            </defs>
        </svg>

        <noscript><p style="padding: 24px">subbed needs JavaScript.</p></noscript>

        <header class="topbar">
            <a class="brand" href="/" :aria-label="t('nav.home')">
                <img src="/static/player/icon.svg" alt="" width="32" height="32" />
                <span>subbed</span>
            </a>
            <button
                class="btn btn-ghost btn-icon"
                type="button"
                popovertarget="settings"
                :aria-label="t('settings.title')"
                :title="t('settings.title')"
            >
                <svg class="icon"><use href="#i-menu" /></svg>
            </button>
        </header>

        <div id="settings" class="settings" popover>
            <h2 x-text="t('settings.title')"></h2>
            <label class="field">
                <span x-text="t('settings.language')"></span>
                <select :value="languagePreference" @change="setLanguage($event.target.value)">
                    <option value="auto" x-text="t('settings.languageAuto')"></option>
                    <option value="en">English</option>
                    <option value="tr">Türkçe</option>
                </select>
            </label>
            <div class="field" role="group" aria-labelledby="theme-label">
                <span id="theme-label" x-text="t('settings.theme')"></span>
                <div class="segmented">
                    <button type="button" :aria-pressed="themePreference === 'system'" @click="setTheme('system')">
                        <svg class="icon"><use href="#i-monitor" /></svg>
                        <span x-text="t('theme.system')"></span>
                    </button>
                    <button type="button" :aria-pressed="themePreference === 'light'" @click="setTheme('light')">
                        <svg class="icon"><use href="#i-sun" /></svg>
                        <span x-text="t('theme.light')"></span>
                    </button>
                    <button type="button" :aria-pressed="themePreference === 'dark'" @click="setTheme('dark')">
                        <svg class="icon"><use href="#i-moon" /></svg>
                        <span x-text="t('theme.dark')"></span>
                    </button>
                </div>
            </div>
            <a class="btn btn-ghost" href="/admin">
                <svg class="icon"><use href="#i-user" /></svg>
                <span x-text="t('settings.admin')"></span>
            </a>
        </div>

        <main>
            <section class="hero" x-show="!videoId && !loading">
                <h1 x-text="t('hero.title')"></h1>
                <p x-text="t('hero.hint')"></p>
                <form class="url-form" @submit="submit($event)">
                    <label class="sr-only" for="url" x-text="t('url.label')"></label>
                    <input
                        id="url"
                        type="text"
                        inputmode="url"
                        x-model="inputUrl"
                        :placeholder="t('url.placeholder')"
                        autocomplete="off"
                        required
                    />
                    <button class="btn btn-primary" type="submit">
                        <svg class="icon"><use href="#i-play" /></svg>
                        <span x-text="t('url.play')"></span>
                    </button>
                </form>
            </section>

            <div class="notice notice-error" x-show="error" role="alert">
                <svg class="icon"><use href="#i-alert" /></svg>
                <span x-text="errorText"></span>
                <button
                    class="btn btn-ghost"
                    type="button"
                    x-show="error?.key !== 'error.invalid'"
                    @click="loadVideo(inputUrl, { updateHistory: false })"
                    x-text="t('error.retry')"
                ></button>
            </div>

            <div class="status" x-show="loading" role="status">
                <span class="spinner"></span>
                <span x-text="t('status.loading')"></span>
            </div>

            <div x-show="videoId">
                <h1 class="title" x-show="title" x-text="title"></h1>

                <div class="notice" x-show="videoId && tracks.length === 0 && !loading">
                    <svg class="icon"><use href="#i-info" /></svg>
                    <span x-text="t('notice.noSubtitles')"></span>
                </div>

                <div class="stage" x-ref="stage">
                    <div class="frame" :style="{ '--subtitle-scale': scale }">
                        <div x-ref="mount"></div>
                        <div class="subtitle" aria-live="off" x-html="cueHtml"></div>
                    </div>
                </div>

                <div class="toolbar">
                    <label class="field" x-show="tracks.length > 0">
                        <span x-text="t('subtitles.label')"></span>
                        <select x-model="trackId" @change="onTrackChange()">
                            <template x-for="item in tracks" :key="item.id">
                                <option :value="item.id" x-text="item.label"></option>
                            </template>
                            <option value="off" x-text="t('subtitles.off')"></option>
                        </select>
                    </label>

                    <div class="field" role="group" x-show="tracks.length > 0" aria-labelledby="size-label">
                        <span id="size-label" x-text="t('size.label')"></span>
                        <div class="stepper">
                            <button
                                class="btn btn-ghost btn-icon"
                                type="button"
                                :aria-label="t('size.smaller')"
                                :title="t('size.smaller')"
                                :disabled="sizeIndex === 0"
                                @click="bumpSize(-1)"
                            >
                                <svg class="icon"><use href="#i-minus" /></svg>
                            </button>
                            <span class="value" x-text="`${Math.round(scale * 100)}%`"></span>
                            <button
                                class="btn btn-ghost btn-icon"
                                type="button"
                                :aria-label="t('size.larger')"
                                :title="t('size.larger')"
                                :disabled="scale >= 1.75"
                                @click="bumpSize(1)"
                            >
                                <svg class="icon"><use href="#i-plus" /></svg>
                            </button>
                        </div>
                    </div>

                    <button class="btn btn-ghost spacer" type="button" x-show="canFullscreen" @click="toggleFullscreen()">
                        <svg class="icon"><use :href="fullscreen ? '#i-minimize' : '#i-maximize'" /></svg>
                        <span x-text="fullscreen ? t('fullscreen.exit') : t('fullscreen.enter')"></span>
                    </button>
                </div>
            </div>
        </main>
    </body>
</html>
